body {

.hi-yellow { background: linear-gradient(180deg, transparent 55%, #FFE066 55%); padding: 0 6px; }
.hi-pink   { background: linear-gradient(180deg, transparent 55%, #FFB7C5 55%); padding: 0 6px; }
.hi-blue   { background: linear-gradient(180deg, transparent 55%, #B5E2FA 55%); padding: 0 6px; }
.hi-green  { background: linear-gradient(180deg, transparent 55%, #B7E4C7 55%); padding: 0 6px; }
@keyframes float-1 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-18px) rotate(10deg)} }
@keyframes float-2 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-22px) rotate(-12deg)} }
@keyframes float-3 { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-14px) rotate(6deg)} }
.deco-1 { animation: float-1 4s ease-in-out infinite; }
.deco-2 { animation: float-2 5s ease-in-out infinite; }
.deco-3 { animation: float-3 3.5s ease-in-out infinite; }
@keyframes burst { 0% { transform: translate(0,0) scale(1); opacity:1; } 100% { transform: translate(var(--bx), var(--by)) scale(0.3); opacity:0; } }
.burst-particle { position: absolute; pointer-events: none; animation: burst 1s ease-out forwards; }

.shake { animation: shake-x 0.4s; }

.bounce-soft { animation: bounce-soft 1.6s ease-in-out infinite; }

.wiggle { animation: wiggle 2.5s ease-in-out infinite; }
@keyframes pulse-grow { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.pulse-grow { animation: pulse-grow 1.8s ease-in-out infinite; }
@keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
.spin-slow { animation: spin-slow 8s linear infinite; }
@keyframes pop-in { 0% { transform: scale(0) rotate(-15deg); opacity:0; } 60% { transform: scale(1.2) rotate(5deg); opacity:1; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.pop-letter { display: inline-block; animation: pop-in 0.5s backwards; }
.card-hover { transition: all 0.2s; }
.card-hover:hover { transform: translateY(-4px) scale(1.02); }
.card-hover:active { transform: scale(0.97); }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #E5E7EB; transition: all 0.3s; }
.dot.active { background: #FF6B9D; transform: scale(1.5); }
.star-btn { transition: transform 0.15s; cursor: pointer; }
.star-btn:hover { transform: scale(1.18); }
.star-btn:active { transform: scale(0.9); }
@keyframes pulse-red { 0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,0.7)} 50%{box-shadow:0 0 0 22px rgba(255,107,107,0)} }
.recording-pulse { animation: pulse-red 1.2s infinite; }
@keyframes dash { to { stroke-dashoffset: -1000; } }
.map-path { stroke: #FFB7C5; stroke-width: 3; stroke-dasharray: 8 8; fill: none; animation: dash 30s linear infinite; }
